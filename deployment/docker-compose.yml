# 生产环境 Docker Compose 配置（服务器构建）
# 适用于在服务器上直接构建镜像的场景
# 使用方式: docker-compose -f deployment/docker-compose.yml up -d --build
#
# 注意：此配置只包含应用服务，数据库和缓存需要外部提供
# 通过环境变量配置连接外部服务

version: "3.8"

services:
  # FastAPI 应用
  app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: fastapi-app
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  app_logs:
