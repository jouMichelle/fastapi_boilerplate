# ===========================================
# 应用配置
# ===========================================
app:
  name: FastAPI Boilerplate
  version: 0.1.0
  description: A production-ready FastAPI boilerplate

# ===========================================
# 服务器配置
# ===========================================
server:
  host: 0.0.0.0
  port: 8000
  reload: true  # 仅开发环境

# ===========================================
# CORS 配置
# ===========================================
cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  methods:
    - "*"
  headers:
    - "*"
  allow_credentials: true

# ===========================================
# 分页配置
# ===========================================
pagination:
  default_page_size: 20
  max_page_size: 100

# ===========================================
# 速率限制配置
# ===========================================
rate_limit:
  enabled: true
  requests_per_minute: 60

# ===========================================
# 文件上传配置
# ===========================================
upload:
  max_size_mb: 10
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
