# ===========================================
# 应用配置（简化版）
# ===========================================
app:
  name: FastAPI Simple
  version: 0.1.0
  description: A simple FastAPI boilerplate for small projects

# ===========================================
# 服务器配置
# ===========================================
server:
  host: 0.0.0.0
  port: 8000
  reload: true  # 仅开发环境

# ===========================================
# CORS 配置
# ===========================================
cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "*"  # 开发环境允许所有来源
  methods:
    - "*"
  headers:
    - "*"
  allow_credentials: true

# ===========================================
# 分页配置
# ===========================================
pagination:
  default_page_size: 20
  max_page_size: 100
