# 开发环境 Docker Compose 配置
# 使用方式: docker-compose -f deployment/docker-compose.dev.yml up -d

version: "3.8"

services:
  # FastAPI 应用（开发模式，支持热重载）
  app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.dev
    container_name: fastapi-app-dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - SECRET_KEY=dev-secret-key-not-for-production
    volumes:
      # 挂载源代码，支持热重载
      - ..:/app
      # 排除虚拟环境
      - /app/.venv
    networks:
      - fastapi-dev-network

  # PostgreSQL（可选，取消注释启用）
  # db:
  #   image: postgres:15-alpine
  #   container_name: fastapi-db-dev
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_DB=fastapi_dev
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_dev_data:/var/lib/postgresql/data
  #   networks:
  #     - fastapi-dev-network

  # Redis（可选，取消注释启用）
  # redis:
  #   image: redis:7-alpine
  #   container_name: fastapi-redis-dev
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - fastapi-dev-network

networks:
  fastapi-dev-network:
    driver: bridge

