# 开发环境 Docker Compose 配置
# 使用方式: docker-compose -f deployment/docker-compose.dev.yml up -d
#
# 注意：此配置只包含应用服务，使用 SQLite 作为默认数据库
# 如需连接外部 PostgreSQL/MySQL，修改 DATABASE_URL 环境变量

version: "3.8"

services:
  # FastAPI 应用（开发模式，支持热重载）
  app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.dev
    container_name: fastapi-app-dev
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      # 挂载源代码，支持热重载
      - ..:/app
      # 排除虚拟环境
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
